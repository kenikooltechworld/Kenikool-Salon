services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: salon_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kenikool-salon
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - salon_network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salon_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - type: bind
        source: ./backend
        target: /app
        bind:
          create_host_path: true
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - salon_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ngrok:
    image: ngrok/ngrok:latest
    container_name: salon_ngrok
    command: http backend:8000
    ports:
      - "4040:4040"
    env_file:
      - ./backend/.env
    depends_on:
      - backend
    networks:
      - salon_network

volumes:
  mongodb_data:

networks:
  salon_network:
    driver: bridge
