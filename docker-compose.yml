services:
  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salon_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - type: bind
        source: ./backend
        target: /app
        bind:
          create_host_path: true
    networks:
      - salon_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  ngrok:
    image: ngrok/ngrok:latest
    container_name: salon_ngrok
    command: http backend:8000
    ports:
      - "4040:4040"
    env_file:
      - ./backend/.env
    depends_on:
      - backend
    networks:
      - salon_network

networks:
  salon_network:
    driver: bridge
